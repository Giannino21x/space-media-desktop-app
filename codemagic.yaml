# Codemagic build pipelines for SPACE Media mobile (Capacitor)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-native-android-app/

workflows:
  # ---- iOS: Build + auto-submit to TestFlight ----
  # Trigger: manual (via Codemagic UI). Avoid auto-trigger so Apple Compliance review isn't
  # disturbed by repeated TestFlight uploads.
  ios-workflow:
    name: iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials   # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: ch.spacemedia.app
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies (mobile)
        script: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Capacitor sync iOS
        script: |
          cd mobile
          npx cap sync ios
      - name: Install signing certificate + provisioning profile
        script: |
          # We pre-generated the distribution certificate and provisioning
          # profile manually (Apple's API can't re-export the private key for
          # a fresh distribution cert). Both are passed in as base64 env vars.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode > /tmp/ios_distribution.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/space_media_app_store.mobileprovision
          keychain initialize
          keychain add-certificates --certificate /tmp/ios_distribution.p12 \
            --certificate-password "$IOS_DISTRIBUTION_CERT_PASSWORD"
          # Generate /Users/builder/export_options.plist from the installed profile
          xcode-project use-profiles --warn-only
      - name: Increment build number
        script: |
          cd mobile/ios/App
          LATEST_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          NEW_BUILD=$(($LATEST_BUILD + 1))
          agvtool new-version -all $NEW_BUILD
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/Info.plist
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false

  # ---- Android: Debug APK (push-triggered) ----
  # Use this for quick installable APKs without Play Store.
  # Triggered automatically on push to master.
  android-workflow:
    name: Android (Debug APK)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies (mobile)
        script: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Capacitor sync Android
        script: |
          cd mobile
          npx cap sync android
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
      - name: Build debug APK (installable without Play Store)
        script: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk

  # ---- Android: Release AAB + Play Store publishing ----
  # Trigger: tag matching v* (e.g. v1.0.0). Does NOT auto-trigger on push.
  # PRECONDITIONS (set up in Codemagic UI BEFORE running):
  #   1. Env group `play_store_credentials` with:
  #      - ANDROID_KEYSTORE_BASE64  (base64 of .signing/android/spacemedia-release.jks)
  #      - ANDROID_KEYSTORE_PASSWORD
  #      - ANDROID_KEY_ALIAS = spacemedia
  #      - ANDROID_KEY_PASSWORD (same as keystore password)
  #      - GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  (JSON content of Play Service Account)
  #      - GOOGLE_PLAY_TRACK = internal | alpha | beta | production
  #   2. App created in Play Console with package name ch.spacemedia.app
  #   3. Service account linked + granted permissions in Play Console → API access
  android-release-workflow:
    name: Android (Release AAB → Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      groups:
        - play_store_credentials
      vars:
        PACKAGE_NAME: ch.spacemedia.app
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies (mobile)
        script: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Capacitor sync Android
        script: |
          cd mobile
          npx cap sync android
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
      - name: Install signing keystore
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
          cat > "$CM_BUILD_DIR/mobile/android/keystore.properties" <<EOF
          storeFile=/tmp/keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Bump versionCode from Play Store (highest across tracks)
        script: |
          # Without GCLOUD_SERVICE_ACCOUNT_CREDENTIALS the lookup fails — keep
          # the versionCode committed in build.gradle instead of forcing 1.
          cd mobile/android/app
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks internal alpha beta production 2>/dev/null || echo "0")
          if [ "$LATEST" -gt 0 ]; then
            NEW=$(($LATEST + 1))
            sed -i.bak "s/versionCode .*/versionCode $NEW/" build.gradle
            echo "New versionCode: $NEW"
          else
            echo "Play lookup unavailable — using versionCode from build.gradle:"
            grep versionCode build.gradle
          fi
      - name: Build release AAB
        script: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
    # NOTE: google_play auto-publish disabled — GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    # not configured yet. Build produces the signed .aab artifact; upload it
    # manually to the Play Console release. Re-enable once a valid service
    # account JSON is set in the play_store_credentials env group.
