# Codemagic build pipelines for SPACE Media mobile (Capacitor)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-native-android-app/

workflows:
  # ---- iOS: Build + auto-submit to TestFlight ----
  ios-workflow:
    name: iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials   # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: ch.spacemedia.app
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies (mobile)
        script: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Capacitor sync iOS
        script: |
          cd mobile
          npx cap sync ios
      - name: Set up code signing (auto-fetch via App Store Connect API)
        script: |
          PBXPROJ=mobile/ios/App/App.xcodeproj/project.pbxproj
          # Capacitor's default pbxproj uses CODE_SIGN_STYLE=Automatic with no team.
          # Switch to Manual and inject DEVELOPMENT_TEAM so codemagic profile is used.
          python3 - "$PBXPROJ" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path) as f:
              s = f.read()
          # Replace CODE_SIGN_STYLE = Automatic; with Manual + DEVELOPMENT_TEAM
          s = re.sub(
              r'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = 699K5VAG3G;',
              s,
          )
          with open(path, 'w') as f:
              f.write(s)
          print('patched', path)
          PYEOF
          # Fetch + install signing files from App Store Connect API
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd mobile/ios/App
          LATEST_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          NEW_BUILD=$(($LATEST_BUILD + 1))
          agvtool new-version -all $NEW_BUILD
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false

  # ---- Android: Build AAB for Play Store ----
  android-workflow:
    name: Android (Play Store)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - google_play_credentials   # set in Codemagic: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
      android_signing:
        - spacemedia_keystore
      node: 22
      java: 21
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'mobile-v*'
          include: true
    scripts:
      - name: Install npm dependencies (mobile)
        script: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Capacitor sync Android
        script: |
          cd mobile
          npx cap sync android
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
      - name: Build Android release AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
      - mobile/android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
