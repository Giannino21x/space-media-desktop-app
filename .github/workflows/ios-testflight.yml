# iOS-Hülle zu TestFlight über GitHub (macOS-Runner, für dieses öffentliche Repo
# gratis und ohne Warteschlange). Codemagic im Gratis-Plan liess am 12.10.2026
# jeden Build 40–100 Minuten auf einen Mac warten.
#
# Signieren wie bei Codemagic: vorhandenes Verteilungszertifikat und das aktive
# App-Store-Profil je Ziel (.github/scripts/asc-profile.mjs). Automatisches
# Signieren geht nicht: das Archiv bräuchte ein Entwicklungsprofil und damit ein
# registriertes Gerät, das Team hat keines (05.11.2026).
#
# Geheimnisse (Repo › Settings › Secrets › Actions):
#   ASC_KEY_ID             Schlüssel-ID (z. B. ABCD123456)
#   ASC_ISSUER_ID          Issuer-ID (UUID oben auf der Seite der API-Schlüssel)
#   ASC_KEY_P8             Inhalt der AuthKey_<ID>.p8
#   IOS_DIST_P12_BASE64    Verteilungszertifikat samt Schlüssel, base64
#   IOS_DIST_P12_PASSWORD  Passwort dazu
#
# Start: ein Tag `testflight-*`. Das Einreichen zur Review bleibt bei Codemagic
# (Tag `ios-*`).
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['testflight-*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: 699K5VAG3G
      PROJEKT: mobile/ios/App/App.xcodeproj
      SCHEMA: App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Xcode 26 wählen
        shell: bash
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then ls -d /Applications/Xcode*.app; echo "Kein Xcode 26 auf dem Runner"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Capacitor
        working-directory: mobile
        shell: bash
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx cap sync ios

      - name: API-Schlüssel ablegen
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Geheimnisse ASC_KEY_ID / ASC_KEY_P8 fehlen (siehe Kopf dieser Datei)."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Build-Nummer
        shell: bash
        run: |
          # Über allem, was Codemagic hochgeladen hat (bis 1.0.6 (24), danach PROJECT_BUILD_NUMBER+100),
          # und je Lauf eindeutig. Ein späterer Codemagic-Build muss darüber liegen.
          NR=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "BUILD_NR=$NR" >> "$GITHUB_ENV"
          echo "Build-Nummer: $NR"

      - name: Signatur einrichten
        shell: bash
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$IOS_DIST_P12_BASE64" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "Geheimnisse IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD fehlen (siehe Kopf dieser Datei)."; exit 1
          fi
          SCHLUESSELBUND="$RUNNER_TEMP/signieren.keychain-db"
          BUND_PW=$(uuidgen)
          echo "::add-mask::$BUND_PW"
          security create-keychain -p "$BUND_PW" "$SCHLUESSELBUND"
          security set-keychain-settings -lut 3600 "$SCHLUESSELBUND"
          security unlock-keychain -p "$BUND_PW" "$SCHLUESSELBUND"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/verteilung.p12"
          security import "$RUNNER_TEMP/verteilung.p12" -k "$SCHLUESSELBUND" -f pkcs12 \
            -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/verteilung.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$BUND_PW" "$SCHLUESSELBUND" > /dev/null
          security list-keychains -d user -s "$SCHLUESSELBUND" $(security list-keychains -d user | tr -d '"')
          echo "SCHLUESSELBUND=$SCHLUESSELBUND" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$SCHLUESSELBUND" | grep -q "Apple Distribution"
          node .github/scripts/asc-profile.mjs

      - name: Archivieren
        shell: bash
        run: |
          set -o pipefail
          # Das Projekt signiert von Hand; asc-profile.mjs hat die Profilnamen eingetragen.
          xcodebuild -project "$PROJEKT" -scheme "$SCHEMA" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NR" \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*(sign|profile|entitlement)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Zu TestFlight hochladen
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ch.spacemedia.app</key><string>$PROFIL_APP</string>
              <key>ch.spacemedia.app.LiveActivity</key><string>$PROFIL_LIVE</string>
            </dict>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "1.0.6 ($BUILD_NR) ist bei Apple. In TestFlight erscheint der Build nach der Verarbeitung (meist 5–15 Minuten)."

      - name: Protokolle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

      - name: Schlüssel entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/asc/"*.p8 "$RUNNER_TEMP/verteilung.p12"
          if [ -n "$SCHLUESSELBUND" ]; then security delete-keychain "$SCHLUESSELBUND" || true; fi
