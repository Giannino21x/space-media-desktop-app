name: Mac-App zu bestehendem Release (signiert + notarisiert)

# Baut die Mac-App fuer ein bestehendes Release-Tag und haengt DMG, ZIP und latest-mac.yml an
# dieses Release (fuer electron-updater auf dem Mac). Eigener Schluesselbund wie in Sport Nexus
# (desktop-mac.yml): electron-builders temporaerer Schluesselbund scheiterte auf macos-latest mit
# «SecKeychainUnlock: passphrase not correct» (build.yml, v1.0.14). Notarisierung ueber den
# App-Store-Connect-API-Schluessel. Start: Actions -> dieser Workflow -> Tag angeben.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehendes Release-Tag, z. B. v1.0.14'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: API-Schluessel fuer Notarisierung schreiben
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Developer-ID-Zertifikat importieren
        env:
          P12_B64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          P12_PW: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Build (DMG + ZIP, x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Signatur und Notarisierung pruefen
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          done

      - name: An das Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${{ inputs.tag }}" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber -R "${{ github.repository }}"
