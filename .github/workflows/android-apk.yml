# Android-Hülle als installierbare APK (Debug, ohne Play Store) — zum Testen
# auf einem Android-Handy, z. B. für Fabio. Läuft auf GitHub (Linux, gratis,
# ohne Warteschlange) bei jedem Push auf huelle-* mit Änderungen unter mobile/,
# bei einem Tag `android-*` oder von Hand. Die APK liegt danach als Artefakt
# «space-media-apk» beim Lauf.
#
# Debug-Signatur: jeder Lauf hat einen eigenen Schlüssel, ein Update über eine
# ältere Test-APK braucht darum einmal Deinstallieren. Für den Play Store bleibt
# Codemagic (Tag v*, android-release-workflow).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['huelle-*']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
    tags: ['android-*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: APK bauen
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: space-media-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
